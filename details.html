<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idea Details – IDEALAUNCH</title>
  <meta name="description" content="Detailed view of a startup idea on IDEALAUNCH. Learn about the business model, target audience, and more." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── Navigation ── -->
<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="dashboard.html" class="nav-logo" aria-label="IDEALAUNCH Home">
      <div class="logo-icon">🚀</div>
      <span class="gradient-text">IDEALAUNCH</span>
    </a>

    <div class="nav-links">
      <a href="dashboard.html" class="nav-link" id="nav-dashboard">📊 Dashboard</a>
      <a href="explore.html"   class="nav-link" id="nav-explore">🔭 Explore</a>
      <a href="saved.html"     class="nav-link" id="nav-saved">🔖 Saved</a>
      <a href="profile.html"   class="nav-link" id="nav-profile">👤 Profile</a>
      <button class="nav-link logout-btn" id="logout-btn" onclick="logout()">⏻ Logout</button>
    </div>

    <button class="hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Mobile nav -->
<div class="mobile-nav" id="mobile-nav" role="navigation" aria-label="Mobile navigation">
  <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
  <a href="explore.html"   class="nav-link">🔭 Explore</a>
  <a href="saved.html"     class="nav-link">🔖 Saved</a>
  <a href="profile.html"   class="nav-link">👤 Profile</a>
  <button class="nav-link logout-btn" onclick="logout()">⏻ Logout</button>
</div>

<!-- ── Page Content ── -->
<div class="page-wrapper">
  <div class="container">

    <!-- Breadcrumb -->
    <nav aria-label="Breadcrumb" style="padding-top:24px;margin-bottom:8px">
      <span style="font-size:0.85rem;color:var(--text-muted)">
        <a href="explore.html" style="color:var(--neon-cyan);font-weight:500">Explore</a>
        <span style="margin:0 8px;color:var(--text-muted)">›</span>
        <span>Idea Details</span>
      </span>
    </nav>

    <!-- Details Container (populated by details.js) -->
    <div id="details-container">
      <!-- Loading state -->
      <div class="details-layout">
        <div class="details-main">
          <div class="skeleton" style="height:320px;border-radius:var(--radius-xl);margin-bottom:24px"></div>
          <div class="skeleton" style="height:80px;border-radius:var(--radius-lg)"></div>
        </div>
        <div class="details-sidebar">
          <div class="skeleton" style="height:120px;border-radius:var(--radius-lg);margin-bottom:16px"></div>
          <div class="skeleton" style="height:280px;border-radius:var(--radius-lg)"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/details.js"></script>
<script>
  /* ── Hamburger menu ── */
  const hamburger = document.getElementById('hamburger');
  const mobileNav = document.getElementById('mobile-nav');

  hamburger.addEventListener('click', () => {
    const isOpen = mobileNav.classList.toggle('open');
    hamburger.classList.toggle('open', isOpen);
    hamburger.setAttribute('aria-expanded', isOpen);
  });

  mobileNav.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      mobileNav.classList.remove('open');
      hamburger.classList.remove('open');
    });
  });
</script>

</body>
</html>
